<!DOCTYPE html>
<html>
<head>
    <title>Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">One</div>
        <div class="box">Two</div>
        <div class="box">Three</div>

    </div>

</body>
</html>
