<!DOCTYPE html>
<html>
<head>
    <title>Newspaper Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #eee;
            font-family: Arial, sans-serif;
        }

        .newspaper {
            width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            overflow: auto;
        }

  
        .top {
            width: 100%;
            height: 110px;
            border-bottom: 3px solid black;
            margin-bottom: 15px;
        }

        .logo {
            float: left;
            width: 55%;
            height: 80px;
            border: 2px solid black;
        }

        .top-right {
            float: right;
            width: 40%;
            height: 80px;
            border: 2px solid black;
        }


        .left {
            float: left;
            width: 23%;
            padding-right: 10px;
        }

        .middle {
            float: left;
            width: 54%;
            padding: 0 10px;
        }

        .right {
            float: right;
            width: 23%;
            padding-left: 10px;
        }

        .box {
            border: 2px solid black;
            margin-bottom: 12px;
        }

        .small {
            height: 100px;
        }

        .medium {
            height: 180px;
        }

        .large {
            height: 300px;
        }

        .center-large {
            height: 330px;
        }

        /* ---------- BOTTOM ---------- */

        .bottom {
            clear: both;
            width: 100%;
            height: 130px;
            border-top: 3px solid black;
            margin-top: 10px;
            padding-top: 15px;
        }

        .bottom-left {
            float: left;
            width: 65%;
            height: 90px;
            border: 2px solid black;
        }

        .bottom-right {
            float: right;
            width: 30%;
            height: 90px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <div class="newspaper">

        
        <div class="top">
            <div class="logo"></div>
            <div class="top-right"></div>
        </div>

        <div class="left">
            <div class="box small"></div>
            <div class="box medium"></div>
            <div class="box small"></div>
            <div class="box medium"></div>
        </div>

        <div class="middle">
            <div class="box small"></div>
            <div class="box center-large"></div>
            <div class="box medium"></div>
        </div>

        <div class="right">
            <div class="box medium"></div>
            <div class="box small"></div>
            <div class="box medium"></div>
            <div class="box small"></div>
        </div>

        <div class="bottom">
            <div class="bottom-left"></div>
            <div class="bottom-right"></div>
        </div>

    </div>

</body>
</html>
