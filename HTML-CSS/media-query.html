<!DOCTYPE html>
<html>
<head>
    <title>Media Query</title>
    <style>
        .box {
            width: 400px;
            padding: 30px;
            background-color: lightblue;
        }

        @media (max-width: 600px) {
            .box {
                width: 200px;
                background-color: lightgreen;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        Resize the browser
    </div>

</body>
</html>
