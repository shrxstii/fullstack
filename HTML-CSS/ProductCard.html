<!DOCTYPE html>
<html>
<head>
    <title> Product Cards</title>
</head>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    }

    body{
    background:#f5f5f5;
    padding:30px;
    }

    h2{
    text-align:center;
    margin-bottom:25px;
    }

    .container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    }

    .card{
        width:220px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }


    .card h3{
        font-size:18px;
        margin-bottom:8px;
    }

    .card p{
    font-size:14px;
    color:#555;
    margin-bottom:10px;
    }

    .card h4{
    margin-bottom:10px;
    color:#222;
    }

    button{
    
        background:#4f46e5;
        color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    }

    button:hover{
        background:#3730a3;
    }
</style>
<body>

<h2> Product Cards</h2>

<div class="container">

    <div class="card">
        
        <h3>Wireless Headphones</h3>
        <p>High quality sound with noise cancellation.</p>
        <h4>₹1,999</h4>
        <button>Buy Now</button>
    </div>

    <div class="card">
        
        <h3>Smart Watch</h3>
        <p>Track your fitness and stay connected.</p>
        <h4>₹2,499</h4>
        <button>Buy Now</button>
    </div>

    <div class="card">
        
        <h3>Bluetooth Speaker</h3>
        <p>Loud, clear and powerful bass.</p>
        <h4>₹1,299</h4>
        <button>Buy Now</button>
    </div>
  


</div>

</body>
</html>
