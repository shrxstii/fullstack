
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Guess the Number <span>✦</span></h1>
        <p class="subtitle">A little game of luck and logic!</p>

        <div class="game-box">
            <h2>I'm thinking of a number...</h2>
            <p>Choose a number between 1 and 100</p>

            <div class="number-box" id="numberBox">?</div>

            <p class="chances">
                Chances left: <span id="chances">7</span>
            </p>

            <form id="guessForm">
                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter your guess"
                    min="1"
                    max="100"
                    required
                >
                <button type="submit">Check Guess</button>
            </form>

            <p id="message">Your adventure starts here!</p>

            <div class="history-box">
                <h3>Your Guesses</h3>
                <p id="history">No guesses yet</p>
            </div>

            <button id="newGame" class="new-game">New Game ↻</button>
        </div>

        <p class="footer">Think smart. Guess better. ✨</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
