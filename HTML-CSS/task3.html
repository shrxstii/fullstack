<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background-color:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:300px;
            background-color:white;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            overflow:hidden;
        }

        .card img{
            width:100%;
            height:220px;
        }

        .content{
            padding:20px;
        }

        .content h2{
            margin-bottom:10px;
        }

        .content p{
            color:gray;
            margin-bottom:15px;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:10px;
            background-color:royalblue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background-color:blue;
        }

    </style>

</head>
<body>

    <div class="card">

        <img src="https://www.istockphoto.com/photo/headphones-on-white-backgr">

        <div class="content">

            <h2>headphones</h2> 
            <p>Comfortable.</p>
            <div class="price">$79.99</div>
            <button>Add to Cart</button>

        </div>
        

    </div>

</body>
</html>
