<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section h2{
            color: blue;
        }
        section>h2{
            color:red;
        }
        h2+p{
            color: green;
        }
        h2-p{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <section>
        <h2>heading</h2>
        <p>para 1</p>
        <p>para 2</p>
        <h2>heading 2</h2>
    </section>
    
</body>
</html>
