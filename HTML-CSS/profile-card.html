<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .card {
            width: 280px;
            background-color: white;
            padding: 20px;
            margin: 50px auto;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .card h2 {
            margin-bottom: 5px;
        }

        .card p {
            color: gray;
        }

        button {
            padding: 10px 25px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Profile">

        <h2>Shristi</h2>
        <p>CSE AIML Student</p>

        <p>Learning Web Development and AI/ML.</p>

        <button>Follow</button>
    </div>

</body>
</html>
