<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                #d9d2cc,
                #e99b8d,
                #b46d86,
                #245a78
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 450px;
            height: 220px;
            border: 4px solid white;
            border-radius: 120px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 10px;
        }

        .sun {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;

            box-shadow:
                0 0 10px white,
                0 0 25px #ffd6a5,
                0 0 45px #ff9a76;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="sun"></div>
    </div>

    
</body>
</html>
