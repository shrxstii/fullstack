<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Now Closer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .box {
            min-height: 170px;
            border-radius: 10px;
            padding: 20px;
        }

        .white {
            background-color: white;
            color: black;
        }

        .green {
            background-color: green;
            color: white;
        }

        .red {
            background-color: red;
            color: white;
        }


        /* Heading */

        .heading {
            grid-column: span 2;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .heading h1 {
            color: green;
            font-size: 55px;
        }


        /* Hand */

        .hand {
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 70px;
        }


        /* Team */

        .team {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .team-box {
            background-color: white;
            color: red;

            padding: 25px;
            border-radius: 15px;
        }

        .team-box h2 {
            font-size: 27px;
            margin: 15px 0;
        }


        /* Sync */

        .sync {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sync h2 {
            color: red;
            font-size: 40px;
        }


        /* People */

        .people {
            grid-row: span 2;

            display: flex;
            flex-direction: column;

            justify-content: space-between;
            align-items: center;

            text-align: center;
        }

        .people h2 {
            color: red;
            font-size: 35px;
        }

        .people p {
            color: red;
            margin-top: 10px;
        }

        .people-list {
            display: flex;
            gap: 5px;
        }

        .person {
            font-size: 45px;
        }


        /* Chat */

        .chat {
            display: flex;
            flex-direction: column;

            justify-content: center;

            gap: 12px;
        }

        .message {
            background-color: green;
            color: white;

            padding: 10px;
            border-radius: 10px;

            width: 85%;
        }

        .reply {
            background-color: lightgreen;
            color: black;

            align-self: flex-end;
        }


        /* Touch */

        .touch {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
        }

        .touch-text {
            background-color: black;
            color: white;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

        .people-small {
            display: flex;
            gap: 5px;
        }

        .circle {
            width: 45px;
            height: 45px;

            background-color: white;
            color: black;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
        }


        /* Tablet */

        @media (max-width: 800px) {

            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .heading {
                grid-column: span 2;
            }

            .hand {
                grid-column: span 2;
            }

            .heading h1 {
                font-size: 45px;
            }

        }


        /* Mobile */

        @media (max-width: 550px) {

            body {
                padding: 10px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .heading,
            .hand {
                grid-column: span 1;
            }

            .heading h1 {
                font-size: 38px;
            }

            .people {
                grid-row: span 1;
                min-height: 250px;
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <div class="grid">


            <!-- Heading -->

            <div class="box white heading">

                <h1>
                    better<br>
                    now closer
                </h1>

            </div>


            <!-- Hand -->

            <div class="box green hand">

                🤝

            </div>


            <!-- Team Adaptation -->

            <div class="box red team">

                <div class="team-box">

                    <small>
                        24 Mar &nbsp;&nbsp; 09:00 - 10:00
                    </small>

                    <h2>
                        Team<br>
                        Adaptation
                    </h2>

                    <small>
                        HR grooming
                    </small>

                </div>

            </div>


            <!-- Sync -->

            <div class="box white sync">

                <h2>
                    ▣ sync
                </h2>

            </div>


            <!-- People -->

            <div class="box white people">

                <div>

                    <h2>
                        Bring People<br>
                        Together
                    </h2>

                    <p>
                        [ sync.com ]
                    </p>

                </div>


                <div class="people-list">

                    <div class="person">
                        👩
                    </div>

                    <div class="person">
                        👨
                    </div>

                    <div class="person">
                        👩
                    </div>

                </div>

            </div>


            <!-- Chat -->

            <div class="box white chat">

                <div class="message">
                    Hi! Where are you?
                </div>

                <div class="message reply">
                    I'll be in touch
                </div>

            </div>


            <!-- Touch -->

            <div class="box green touch">

                <div class="touch-text">
                    I'll be in touch
                </div>

                <div class="people-small">

                    <div class="circle">
                        👨
                    </div>

                    <div class="circle">
                        👩
                    </div>

                    <div class="circle">
                        👩
                    </div>

                </div>

            </div>


        </div>

    </div>

</body>
</html>
