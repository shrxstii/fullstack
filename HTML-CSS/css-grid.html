<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .box {
            background-color: lightpink;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>

    </div>

</body>
</html>
