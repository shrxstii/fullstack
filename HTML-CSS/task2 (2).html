<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

nav{
    background-color:#333;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

ul{
    list-style:none;
    display:flex;
    gap:25px;
}

ul li a{
    text-decoration:none;
    color:white;
    font-size:18px;
}

ul li a:hover{
    color:yellow;
}

@media (max-width:768px){

    nav{
        flex-direction:column;
        align-items:center;
    }

    ul{
        flex-direction:column;
        width:100%;
        text-align:center;
        margin-top:15px;
        gap:10px;
    }

}

</style>

</head>
<body>

<nav>

    <div class="logo">logo</div>

    <ul>
        <li><a href="#">nav1</a></li>
        <li><a href="#">nav2</a></li>
        <li><a href="#">nav3</a></li>
        <li><a href="#">nav4</a></li>
        <li><a href="#">nav5</a></li>
    </ul>

</nav>

</body>
</html>
