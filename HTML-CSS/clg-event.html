<!DOCTYPE html>
<html>
<head>
    <title>College Event</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightgray;
        }

        header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .event {
            background-color: white;
            width: 80%;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .details {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 25px;
        }

        .box {
            padding: 20px;
            background-color: lightblue;
        }

        button {
            padding: 12px 25px;
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tech Fest 2026</h1>
        <p>Annual Technical Event of Our College</p>
    </header>

    <div class="event">
        <h2>Tech Fest 2026</h2>

        <p>
            Join us for coding competitions, technical sessions
            and exciting activities.
        </p>

        <div class="details">
            <div class="box">
                <h3>Date</h3>
                <p>20 November 2026</p>
            </div>

            <div class="box">
                <h3>Venue</h3>
                <p>College Auditorium</p>
            </div>

            <div class="box">
                <h3>Time</h3>
                <p>10:00 AM</p>
            </div>
        </div>

        <button>Register Now</button>
    </div>

</body>
</html>
