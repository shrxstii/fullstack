<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
        }

        .header span {
            background-color: #c9a85b;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .magazine {
            display: grid;
            grid-template-columns: 1.5fr 0.8fr 0.8fr;
            grid-template-rows: 150px 150px 130px;
            gap: 10px;
        }

        .featured {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
            background-color: #eadff0;
        }

        .news1 {
            grid-column: 3;
            grid-row: 1;
            background-color: #dfeeea;
        }

        .news2 {
            grid-column: 3;
            grid-row: 2;
            background-color: #e4eeee;
        }

        .advertisement {
            grid-column: 1;
            grid-row: 3;
            background-color: #d9eaf2;
        }

        .article {
            grid-column: 2;
            grid-row: 3;
            background-color: #f4edcf;
        }

        .news3 {
            grid-column: 3;
            grid-row: 3;
            background-color: #e5eeee;
        }

        .magazine > div {
            border-radius: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 18px;
            color: #333;
            padding: 15px;
        }

        .description {
            text-align: center;
            color: #555;
            line-height: 1.5;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>TASK 3 - MAGAZINE LAYOUT</h2>
            <span>MEDIUM</span>
        </div>

        <div class="magazine">

            <div class="featured">
                FEATURED<br>
                ARTICLE
            </div>

            <div class="news1">
                NEWS 1
            </div>

            <div class="news2">
                NEWS 2
            </div>

            <div class="advertisement">
                ADVERTISEMENT
            </div>

            <div class="article">
                ARTICLE
            </div>

            <div class="news3">
                NEWS 3
            </div>

        </div>

        <p class="description">
            Magazine style with featured article, news,<br>
            advertisement and more.
        </p>

    </div>

</body>

</html>
