
<!DOCTYPE html>
<html>
<head>
    <title>Reaction Timer Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Reaction Timer</h1>
        <p class="subtitle">Test how fast your reflexes are!</p>

        <div class="info">
            <p>Best Time: <span id="bestTime">--</span></p>
            <p>Last Time: <span id="lastTime">--</span></p>
        </div>

        <div class="game-box" id="gameBox">
            <h2 id="gameText">Ready to Test?</h2>
            <p id="instruction">Click Start and wait for green!</p>
        </div>

        <h2 id="result"></h2>

        <button id="startBtn">START GAME</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
