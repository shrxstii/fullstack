<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
.login{
    width: 300px;
    background: white;
    border: 2px solid black;
    padding: 20px;
    margin: 100px auto;
    text-align: center;
    border-radius: 10px;
}

input{
    width: 90%;
    padding: 8px;
}

button{
    width: 95%;
    padding: 10px;
    background: blue;
    color: white;
    border: none;
    border-radius: 5px;
}

button:hover{
    background: darkblue;
}
</style>
</head>
<body>
    <div style="align-items: center; border: 1px solid black; padding: 20px; width: 300px; margin: auto; margin-top: 100px;">
        <h1 style="text-align: center;">Login</h1>
<form action="/login" method="post" align="center">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required><br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>
    <input type="submit" value="Login">
</form>
</div>
</body>
</html>
