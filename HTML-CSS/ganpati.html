      0 0 5px white,
      0 0 15px #ff9aa5,

    animation:textIn 1.5s 11.7s forwards;

@keyframes textIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    display:inline-block;
    animation:heart 1s infinite 13s;
}

@keyframes heart{
    50%{transform:scale(1.3)}
}

/* =========================================
             SCALE + POSITION
   ========================================= */

function transform(p){

    const scale=Math.min(innerWidth,innerHeight)/600;

    return {
        x:innerWidth/2+(p[0]-250)*scale,
        y:innerHeight/2+(p[1]-325)*scale
    };
}


/* =========================================
          DRAWING STATE
   ========================================= */

let progress=0;

const speed=0.010;

let particles=[];


/* =========================================
            DRAW PATH
   ========================================= */

function drawPath(points,amount){

    if(amount<=0)return;

    ctx.beginPath();

    let count=Math.floor(
        (points.length-1)*amount
    );

    for(let i=0;i<=count;i++){

        const p=transform(points[i]);

        if(i===0)
            ctx.moveTo(p.x,p.y);
        else
            ctx.lineTo(p.x,p.y);
    }

    if(count<points.length-1){

        const a=transform(points[count]);
        const b=transform(points[count+1]);

        const f=
          ((points.length-1)*amount)-count;

        ctx.lineTo(
            a.x+(b.x-a.x)*f,
            a.y+(b.y-a.y)*f
        );
    }

    ctx.stroke();
}


/* =========================================
             GLITTER
   ========================================= */

function glitter(x,y){

    for(let i=0;i<3;i++){

        particles.push({
            x:x,
            y:y,
            vx:(Math.random()-.5)*1.8,
            vy:(Math.random()-.5)*1.8,
            life:1,
            size:Math.random()*2.5+1
        });
    }
}


function drawParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life-=.025;

        if(p.life<=0){

            particles.splice(i,1);
            continue;
        }

        ctx.save();

        ctx.globalAlpha=p.life;

        ctx.fillStyle="white";

        ctx.shadowBlur=15;
        ctx.shadowColor="#ff9fac";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================
             BACKGROUND STARS
   ========================================= */

let stars=[];

for(let i=0;i<100;i++){

    stars.push({
        x:Math.random()*innerWidth,
        y:Math.random()*innerHeight,
        size:Math.random()*2+0.5,
        phase:Math.random()*Math.PI*2
    });
}


function drawStars(){

    stars.forEach(s=>{

        const alpha=
          .25+
          Math.sin(
            performance.now()/500+s.phase
          )*.35;

        ctx.save();

        ctx.globalAlpha=alpha;

        ctx.fillStyle="white";

        ctx.shadowBlur=12;
        ctx.shadowColor="#ff9eaa";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    });
}


/* =========================================
              MAIN ANIMATION
   ========================================= */

function animate(){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    drawStars();

    /*
       Each path starts one after another.
    */

    let current=0;

    paths.forEach((path,index)=>{

        const start=index*0.85;

        const amount=
          Math.max(
            0,
            Math.min(
              1,
              (progress-start)/0.85
            )
          );

        if(amount>0){

            ctx.save();

            ctx.strokeStyle=
                "#ffdce0";

            ctx.lineWidth=
                Math.max(
                    3,
                    Math.min(innerWidth,innerHeight)/125
                );

            ctx.lineCap="round";
            ctx.lineJoin="round";

            ctx.shadowBlur=8;
            ctx.shadowColor="#ff9ba8";

            drawPath(path,amount);

            ctx.stroke();

            ctx.restore();

            /*
              Glitter near the current drawing end
            */

            if(amount<1){

                const n=
                  Math.floor(
                    (path.length-1)*amount
                  );

                if(path[n]){

                    const p=
                      transform(path[n]);

                    glitter(p.x,p.y);
                }
            }
        }

    });


    drawParticles();

    progress+=speed;

    requestAnimationFrame(animate);
}

animate();
