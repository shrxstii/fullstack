<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1%;
            grid-template-areas: 
            "box1 box2 box2"
            "box3 box3 box6"
            "box4 box5 box6"
            "box7 box8 box9";
           
        }
        @media (max-width: 500px) {
            .container {
                
                grid-template-areas: 
                "box1 box1"
                "box2 box2"
                "box3 box3"
                "box5 box6"
                "box"
            }
        }
        .box {
           display: flex;
           background-color: #222;
           align-items: center;
           text-align: center;
           justify-content: center;
           min-height: 100px;
           color: #fff;
           font-size: 20px;
           border: 1px solid #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;">1</div>
        <div class="box" style="grid-area: box2;">2</div>
        <div class="box" style="grid-area: box3;">3</div>
        <div class="box" style="grid-area: box4;">4</div>
        <div class="box" style="grid-area: box5;">5</div>
        <div class="box" style="grid-area: box6;">6</div>
        <div class="box" style="grid-area: box7;">7</div>
        <div class="box" style="grid-area: box8;">8</div>
        <div class="box" style="grid-area: box9;">9</div>

    </div>
</body>
</html>
