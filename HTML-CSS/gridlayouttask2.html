<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .container {
    width: 200px;
    height: 140px;
    display: grid;
    grid-template-columns: 60px 130px;
    grid-template-rows: 40px 90px;
    gap: 10px;
}

.one {
    grid-column: 1 / 3;
    background-color: yellow;
    border: 2px blue;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.two {
    background-color: green;
    border: 2px orange;
    color: white;
    padding: 5px 15px;
    font-size: 16px;
}

.three {
    background-color: #245b16;
    border: 2px solid green;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 5px;
    font-size: 16px;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    
</body>
</html>
