<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .card {
            width: 250px;
            background-color: white;
            padding: 15px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        .card img {
            width: 100%;
        }

        .card h2 {
            margin-bottom: 5px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/250" alt="Product">

        <h2>Smart Watch</h2>

        <p>Latest smart watch with useful features.</p>

        <p class="price">₹2,999</p>

        <button>Buy Now</button>
    </div>

</body>
</html>
